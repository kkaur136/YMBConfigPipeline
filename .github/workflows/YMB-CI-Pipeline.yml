# This CI pipeline gives Ben Secure a Git-based audit record for every change to the YMB banking application.
# It records each test result and helps YMB demonstrate controlled changes during an OSFI audit.


name: YMB Banking App CI Pipeline
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
 
      - name: Run pytest
        run: pytest test_main.py -v
